# Internal-only Service for the restaurant MCP server: it is reachable inside the cluster and
# nowhere else, so applying this file can never create a public address.
#
# The Private MCP Gateway runs in the AgentBase VPC, so it needs a PRIVATE address of your VPC
# to call. Pick one (see "Make it reachable from the gateway" in README.md):
#   - service-nodeport.yaml (this folder): replaces this Service with a NodePort, reachable on
#     the private IPs of the worker nodes.
#   - an internal load balancer: needs a GreenNode annotation that this repository does not
#     verify, so none is guessed here.
apiVersion: v1
kind: Service
metadata:
  name: restaurant-mcp-server
  namespace: restaurant-mcp
  labels:
    app: restaurant-mcp-server
spec:
  type: ClusterIP
  selector:
    app: restaurant-mcp-server
  ports:
    - name: http
      port: 8080            # plain HTTP: TLS is not terminated by these manifests (see README.md)
      targetPort: http
      protocol: TCP
